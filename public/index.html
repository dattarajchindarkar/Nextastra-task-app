
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextAstra | Task Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #202438;
        }

        header {
            background: #171d35;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 23px;
        }

        header span {
            color: #aab8ff;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #737b91;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #17213b0c;
        }

        .stat-card p {
            color: #777f93;
            margin-bottom: 12px;
        }

        .stat-card h2 {
            font-size: 30px;
        }

        .main-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px #17213b0c;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 12px;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #465ee8;
            color: white;
        }

        .edit {
            background: #e9edff;
            color: #4056d6;
            margin-right: 5px;
        }

        .delete {
            background: #ffe8e8;
            color: #d43b3b;
        }

        .form {
            display: none;
            background: #f7f8fc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form h3 {
            margin-bottom: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #dce0eb;
            border-radius: 7px;
            outline: none;
            background: white;
        }

        .form-actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .cancel {
            background: #e7e9ef;
            color: #333;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #edf0f5;
        }

        th {
            color: #777f93;
            font-size: 12px;
            text-transform: uppercase;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pending {
            background: #fff3d9;
            color: #a36b00;
        }

        .completed {
            background: #dff7e9;
            color: #18844a;
        }

        #message {
            margin-bottom: 15px;
            color: #4056d6;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777f93;
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px 20px;
            }

            .section-heading {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Next<span>Astra</span></h1>
    <p>Task Manager</p>
</header>

<div class="container">

    <div class="welcome">
        <h2>Task Dashboard</h2>
        <p>Manage your team's tasks in one place.</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <p>Total Tasks</p>
            <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
            <p>Pending Tasks</p>
            <h2 id="pendingTasks">0</h2>
        </div>

        <div class="stat-card">
            <p>Completed Tasks</p>
            <h2 id="completedTasks">0</h2>
        </div>
    </div>

    <div class="main-card">

        <div class="section-heading">
            <div>
                <h2>My Tasks</h2>
                <p style="color:#777f93; margin-top:6px">
                    Create and manage your tasks
                </p>
            </div>

            <button class="primary" onclick="showForm()">
                + Add Task
            </button>
        </div>

        <p id="message"></p>

        <form id="taskForm" class="form">
            <h3 id="formTitle">Create New Task</h3>

            <input type="hidden" id="taskId">

            <div class="form-grid">
                <div>
                    <label for="title">Task Title *</label>
                    <input id="title" required placeholder="Enter task title">
                </div>

                <div>
                    <label for="assignedTo">Assigned To</label>
                    <input id="assignedTo" placeholder="Person's name">
                </div>

                <div>
                    <label for="dueDate">Due Date</label>
                    <input type="date" id="dueDate">
                </div>

                <div>
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="primary">Save Task</button>
                <button type="button" class="cancel" onclick="hideForm()">
                    Cancel
                </button>
            </div>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Task</th>
                        <th>Assigned To</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="taskList">
                    <tr>
                        <td colspan="6" class="empty">Loading tasks...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    const API = '/api/tasks';

    const taskForm = document.getElementById('taskForm');
    const taskList = document.getElementById('taskList');

    async function loadTasks() {
        try {
            const response = await fetch(API);

            if (!response.ok) {
                throw new Error('Unable to load tasks');
            }

            const tasks = await response.json();

            document.getElementById('totalTasks').textContent = tasks.length;

            document.getElementById('pendingTasks').textContent =
                tasks.filter(task => task.status === 'pending').length;

            document.getElementById('completedTasks').textContent =
                tasks.filter(task => task.status === 'completed').length;

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty">
                            No tasks yet. Add your first task!
                        </td>
                    </tr>`;
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <tr>
                    <td>${task.id}</td>
                    <td>${escapeHTML(task.title)}</td>
                    <td>${escapeHTML(task.assigned_to || '-')}</td>
                    <td>${escapeHTML(task.due_date || '-')}</td>
                    <td>
                        <span class="status ${task.status === 'completed' ? 'completed' : 'pending'}">
                            ${escapeHTML(task.status)}
                        </span>
                    </td>
                    <td>
                        <button class="edit" onclick="editTask(${task.id})">
                            Edit
                        </button>
                        <button class="delete" onclick="deleteTask(${task.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `).join('');

        } catch (error) {
            showMessage(error.message);
            taskList.innerHTML = `
                <tr><td colspan="6" class="empty">
                    Could not connect to the API.
                </td></tr>`;
        }
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function showForm() {
        taskForm.reset();
        document.getElementById('taskId').value = '';
        document.getElementById('formTitle').textContent = 'Create New Task';
        taskForm.style.display = 'block';
    }

    function hideForm() {
        taskForm.style.display = 'none';
    }

    taskForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const id = document.getElementById('taskId').value;

        const task = {
            title: document.getElementById('title').value.trim(),
            assigned_to: document.getElementById('assignedTo').value.trim(),
            due_date: document.getElementById('dueDate').value || null,
            status: document.getElementById('status').value
        };

        if (!task.title) {
            showMessage('Task title is required');
            return;
        }

        try {
            const response = await fetch(id ? `${API}/${id}` : API, {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(task)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || result.message || 'Request failed');
            }

            showMessage(id ? 'Task updated successfully!' : 'Task created successfully!');
            hideForm();
            loadTasks();

        } catch (error) {
            showMessage(error.message);
        }
    });

    async function editTask(id) {
        try {
            const response = await fetch(`${API}/${id}`);
            const task = await response.json();

            if (!response.ok) {
                throw new Error(task.message || 'Unable to fetch task');
            }

            document.getElementById('taskId').value = task.id;
            document.getElementById('title').value = task.title;
            document.getElementById('assignedTo').value = task.assigned_to || '';
            document.getElementById('dueDate').value = task.due_date || '';
            document.getElementById('status').value = task.status;

            document.getElementById('formTitle').textContent = 'Edit Task';
            taskForm.style.display = 'block';

        } catch (error) {
            showMessage(error.message);
        }
    }

    async function deleteTask(id) {
        if (!confirm('Are you sure you want to delete this task?')) {
            return;
        }

        try {
            const response = await fetch(`${API}/${id}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || 'Unable to delete task');
            }

            showMessage('Task deleted successfully!');
            loadTasks();

        } catch (error) {
            showMessage(error.message);
        }
    }

    function showMessage(message) {
        document.getElementById('message').textContent = message;
    }

    loadTasks();
</script>

</body>
</html>
